# N1 解析后的参数。给人看，引擎不加载本文件。
# 运行时叠法：strategy.toml → candidate_c.toml → Strong Bull 时 strategy_e.toml
# 冻结点 2026-08-14。改这些数必须另冻新策略。

[identity]
name = "N1"
parent = "E2"
parent_commit = "70cc50ad965234b99a5a136d4e4f283eedd4281f"
version_tag = "Strategy_N1_70cc50a_risk085"
only_change = "strong_bull_trade_risk 0.0065 -> 0.0085"
status = "paper"
broker = "longbridge_demo"

[universe]
top_n = 50
min_price = 10.0
min_history_days = 200
min_average_dollar_volume = 100000000.0
common_stock_only = true
rebalance = "monthly_pit_stage_250"

[schedule]
timezone = "America/New_York"
entry_time = "13:35"
half_session_no_new_entries = true

[selection]
momentum_days = [20, 44, 88]
momentum_top_fraction = 0.55
max_new_positions = 5
sort_keys = ["relative_sector_score", "score_percentile", "symbol"]
eligible = "return_44 > 0 and return_88 > 0 and adv >= 1e8"

[sixth_slot]
enabled = true
rule = "D3"
score_percentile = 0.80
trend_efficiency_percentile = 0.60
acceleration_percentile = 0.65

[regime]
# 体制看写死 19 只，不看当月 Top50
spy_rule = "close > SMA200"
qqq_rule = "close > SMA200"
breadth_rule = "close > SMA100"
breadth_threshold = 0.50
confirm_days = 2
initial_active = "neutral"
names = [
  "AAPL.US", "MSFT.US", "NVDA.US", "AVGO.US", "META.US",
  "GOOGL.US", "AMZN.US", "TSLA.US", "JPM.US", "BAC.US",
  "LLY.US", "UNH.US", "COST.US", "WMT.US", "HD.US",
  "CAT.US", "GE.US", "XOM.US", "CVX.US",
]

[strong_bull]
# 这套广度看当月宇宙，不是上面 19 只
active_must_be = "bull"
c_breadth_min = 0.65
spy_return_44_positive = true
qqq_return_44_positive = true

[risk]
# N1 唯一改动在 strong_bull_trade_risk
strong_bull_trade_risk = 0.0085
bull_trade_risk = 0.005
neutral_trade_risk = 0.0035
bear_trade_risk = 0.0025
strong_bull_cap = 1.00
bull_cap = 0.90
neutral_cap = 0.60
bear_cap = 0.20
single_name_cap = 0.15
sector_cap = 0.30
issuer_cap = 0.15
issuer_merge = ["GOOG.US", "GOOGL.US"]

[sizing]
# stop_atr_mult 只进股数分母，不拿去比价
size_mult_high = 1.15
size_mult_high_min_percentile = 0.80
size_mult_mid = 1.00
size_mult_mid_min_percentile = 0.50
size_mult_low = 0.85
stop_atr_mult = 2.0
stop_atr_mult_wide = 2.5
wide_atr_percentile = 0.70
wide_trend_efficiency_percentile = 0.50
wide_score_percentile = 0.80

[stops]
# 仓上真正比价的止损
initial_atr_mult = 2.5
trailing_atr_mult = 3.0
trail_starts_at_max_r = 1.0
time_stop_bars = 12
intraday_trigger = "1h_close"
atr_source = "morning_wilder_20"

[execution]
backtest_bar = "15m"
backtest_fill = "first_open_after_1335"
backtest_fill_typical = "13:45"
slippage_bps = 10
commission_bps = 1
paper_limit_deviation_bps = 10

[unused_in_runtime_snapshots]
# 快照里有、N1 不读。列在这里防止抄错。
strategy_toml = [
  "universe",
  "donchian_entry_bars",
  "donchian_exit_bars",
  "supertrend_period",
  "supertrend_multiplier",
  "risk.trade_risk",
  "risk.single_name_cap",
  "risk.sector_cap",
]
candidate_c_toml = ["strong_bull_trade_risk"]
strategy_e_toml = [
  "extension_score_percentile",
  "extension_sector_percentile",
  "extended_score_percentile",
  "extended_sector_percentile",
  "extended_time_stop_bars",
]
